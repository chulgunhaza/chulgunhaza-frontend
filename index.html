    <!--
      DIRECTION CONTRACT — 출근하자 "한 장의 문서" (seed 24191329)
      THESIS: 사내 도구 전체가 한 장의 문서 — 흰 지면, 눈금선으로 구분된
      필드, 카드 그리드·그라디언트 같은 SaaS 기본형을 거부한다. (회사 실사용을 위해

      버밀리온 #d1412b(주 액션 전용 예약색), 수미 먹 #1a1a1a, 잉크 페이드 #8e8a83,
      골드 도트 #d0a229(현재 상태 표시), 눈금선 헤어라인, 고정폭 숫자.
      STORY: 사용자는 열자마자 오늘의 출근 상태와 요약을 읽고, 출근 등록을 끝낸다.
      FIRST VIEWPORT: 좌측 아이콘 레일 / 중앙 좌 '오늘의 출근' 제목·메타·주 액션 /
      우측 '현재 상태' 열(골드 도트 + 고정폭 숫자) / 하단 연차·채팅·게시판 요약 시트.
      FORM: 오리주루 카탈로그 챌린저를 사용자가 채택한 뒤, 회사용으로 조용한 문서
      렌디션으로 환원 (seed 24191329).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
